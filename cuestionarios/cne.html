<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjetas Didácticas: CNE en la Resolución CREG 015</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX for LaTeX Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" xintegrity="sha384-n8MVd4RsNIU0KOVEMcApliTMkCoaMvrIeUoQG00cAl8JKDnhTLg72EnVGPVbeBad" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" xintegrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" xintegrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous"></script>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        /* Custom styles for the flashcard */
        .flashcard-container {
            perspective: 1000px;
        }
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }
        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
        }
        .flashcard-back {
            transform: rotateY(180deg);
        }
        /* Style for KaTeX formulas to ensure visibility */
        .katex { 
            font-size: 1.1em; 
            text-align: center;
            margin: 1rem 0;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-2xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-slate-800">Compensación por Energía no Suministrada (CNE)</h1>
            <p class="text-slate-600 mt-2">Tarjetas didácticas basadas en la Resolución CREG 015 de 2018</p>
        </header>

        <!-- Flashcard Component -->
        <div id="flashcard-container" class="flashcard-container w-full h-80 md:h-96 rounded-2xl shadow-lg cursor-pointer bg-white">
            <div id="flashcard" class="flashcard rounded-2xl">
                <!-- Front of the card -->
                <div id="flashcard-front" class="flashcard-face bg-white text-slate-800 rounded-2xl border-2 border-slate-200">
                    <!-- Content will be injected by JS -->
                </div>
                <!-- Back of the card -->
                <div id="flashcard-back" class="flashcard-face bg-slate-800 text-white rounded-2xl">
                    <!-- Content will be injected by JS -->
                </div>
            </div>
        </div>

        <!-- Navigation -->
        <div class="flex items-center justify-between mt-8 w-full">
            <button id="prev-btn" class="bg-white text-slate-700 font-semibold py-2 px-5 rounded-lg shadow-md hover:bg-slate-200 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                Anterior
            </button>
            <div id="card-counter" class="text-slate-600 font-medium">1 / 8</div>
            <button id="next-btn" class="bg-white text-slate-700 font-semibold py-2 px-5 rounded-lg shadow-md hover:bg-slate-200 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                Siguiente
            </button>
        </div>
        
        <footer class="text-center mt-8 text-sm text-slate-500">
            <p>Haz clic en la tarjeta para voltearla. Usa los botones para navegar.</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const flashcardsData = [
                {
                    front: '<h2 class="text-2xl font-semibold">¿Qué es la Compensación por Energía no Suministrada (CNE)?</h2>',
                    back: `<p class="text-lg">Es una <strong>compensación económica</strong> que el Operador de Red (OR) debe pagar por causar <strong>energía no suministrada (ENS)</strong> o por dejar inoperativos otros activos.</p><p class="mt-4 text-slate-300">Se regula en el Capítulo 5 de la Resolución CREG 015 de 2018.</p>`
                },
                {
                    front: '<h2 class="text-2xl font-semibold">¿Cuál es la fórmula general del CNE para un activo en un mes?</h2>',
                    back: `<p class="text-lg">El CNE total para un activo ($u$) en un mes ($m$) es la suma de las compensaciones por cada indisponibilidad ($i$) ocurrida.</p> <div class="my-4">$$CNE_{m,u} = \\sum_{i=1}^{n} CNE_{i,m,u}$$</div>`
                },
                {
                    front: '<h2 class="text-xl font-semibold">¿Cómo se calcula la compensación para un solo evento ($CNE_{i,m,u}$)?</h2>',
                    back: `<p class="text-lg">Se calcula sumando el producto del valor horario de referencia ($VHRc$) por las horas de no operatividad ($H_{i,r}$) de los activos afectados.</p> <div class="my-4">$$CNE_{i,m,u} = \\sum_{r=1}^{n} (VHRc_{r,m,u} \\cdot H_{i,r})$$</div>`
                },
                {
                    front: '<h2 class="text-xl font-semibold">¿Qué sucede si el valor de la compensación CNE es muy alto?</h2>',
                    back: `<p class="text-lg">Si el CNE calculado supera un máximo, se toma el valor mayor entre el costo de la energía no suministrada ($ENS \\cdot CRO$) y el cálculo original.</p> <div class="my-4 text-sm">$$CNE_{i,m,u} = \\max\\left( (ENS_{i} \\cdot CRO) ; \\sum_{r=1}^{n} (VHRc_{r,m,u} \\cdot H_{i,r}) \\right)$$</div>`
                },
                {
                    front: '<h2 class="text-2xl font-semibold">¿Cómo se integra el CNE en la liquidación total del OR?</h2>',
                    back: `<p class="text-lg">El CNE es uno de los componentes que se suman para calcular el valor total a compensar en el STR ($CSTR_{j,m}$), que se descuenta del ingreso del OR.</p><p class="mt-2 text-slate-300">Fórmula simplificada:</p><div class="text-sm">$$CSTR_{j,m} = \\sum CIM + \\sum [...] + \\sum CNE + CSTRp_{m-1}$$</div>`
                },
                {
                    front: '<h2 class="text-2xl font-semibold">¿Qué son las Zonas Excluidas de CNE (ZNC)?</h2>',
                    back: `<p class="text-lg">Son zonas del sistema que, en condiciones normales, son alimentadas por <strong>un solo circuito o transformador</strong> (radiales).</p><p class="mt-4 text-slate-300">En estas zonas, no se aplica el cálculo de compensaciones CNE.</p>`
                },
                {
                    front: '<h2 class="text-xl font-semibold">¿Una zona puede ser ZNC de forma temporal?</h2>',
                    back: `<p class="text-lg"><strong>Sí.</strong> Una zona puede ser declarada ZNC temporalmente si la indisponibilidad que la vuelve radial es causada por un <strong>evento excluido</strong>.</p>`
                },
                {
                    front: '<h2 class="text-xl font-semibold">¿Cuáles son algunos ejemplos de "eventos excluidos" para una ZNC?</h2>',
                    back: `<p class="text-lg">Eventos que justifican una ZNC temporal incluyen:</p><ul class="list-disc list-inside text-left mt-2 text-slate-300 max-w-md"><li>Trabajos de expansión o reposición.</li><li>Catástrofes naturales.</li><li>Riesgo inminente para la vida humana.</li><li>Instrucciones del Centro Nacional de Operación (CNO).</li></ul>`
                }
            ];

            const flashcardContainer = document.getElementById('flashcard-container');
            const flashcard = document.getElementById('flashcard');
            const front = document.getElementById('flashcard-front');
            const back = document.getElementById('flashcard-back');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const cardCounter = document.getElementById('card-counter');

            let currentCard = 0;

            function updateCard() {
                const data = flashcardsData[currentCard];
                front.innerHTML = data.front;
                back.innerHTML = data.back;
                
                // Render math formulas on the new content
                renderMathInElement(document.body, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ]
                });

                cardCounter.textContent = `${currentCard + 1} / ${flashcardsData.length}`;
                flashcard.classList.remove('is-flipped');
                updateNavButtons();
            }

            function updateNavButtons() {
                prevBtn.disabled = currentCard === 0;
                nextBtn.disabled = currentCard === flashcardsData.length - 1;
            }

            flashcardContainer.addEventListener('click', () => {
                flashcard.classList.toggle('is-flipped');
            });

            prevBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (currentCard > 0) {
                    currentCard--;
                    updateCard();
                }
            });

            nextBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (currentCard < flashcardsData.length - 1) {
                    currentCard++;
                    updateCard();
                }
            });

            // Initial load
            updateCard();
        });
    </script>

</body>
</html>
